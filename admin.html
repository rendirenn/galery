<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Galeri</title>
<style>
:root{--bg:#eceef0;--ink:#16181b;--mut:#626a72;--card:#fff;--acc:#2a3cff;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#15171a;--ink:#eef0f2;--mut:#99a0a8;--card:#1f2226;--acc:#7b88ff;--on:#10131a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
h1{margin:0 0 16px;font-size:30px;letter-spacing:-.02em}h2{margin:24px 0 8px;font-size:20px}
input[type=text],input[type=email],input[type=password]{font:inherit;padding:8px 10px;border:1px solid var(--mut);background:var(--card);color:var(--ink);border-radius:4px;width:100%;max-width:340px}
button{font:inherit;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer}
button.p,button.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:600}
button.d{border-color:#c0392b;color:#c0392b}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.e{color:#c0392b;min-height:1.4em}
.m{color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
.f{background:var(--card);padding:6px}
.f.on{outline:4px solid var(--acc)}
.f img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.f div{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding-top:4px;color:var(--mut)}
.f button{padding:2px 8px;font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body><div class="w">
<h1>Admin galeri</h1>
<form id="login" class="r" hidden style="display:block">
  <p class="m">Masuk dengan akun yang kamu buat di Supabase.</p>
  <div class="r"><input type="email" id="em" placeholder="Email" required autocomplete="username"></div>
  <div class="r"><input type="password" id="pw" placeholder="Kata sandi" required autocomplete="current-password"></div>
  <div class="r"><button class="p">Masuk</button></div><div class="e" id="le"></div>
</form>
<div id="app" hidden>
  <div class="r"><button id="out">Keluar</button></div>
  <h2>Galeri</h2>
  <form id="nf" class="r"><input type="text" id="nt" placeholder="Nama galeri, mis. Prewedding Rina &amp; Dani"><button class="p">Buat galeri</button></form>
  <div class="r" id="gl"></div>
  <div id="det" hidden>
    <h2 id="gt"></h2>
    <div class="r"><input type="text" id="lk" readonly><button id="cp">Salin tautan klien</button></div>
    <div class="r">
      <button class="p" id="up">Unggah foto</button><input type="file" id="fi" accept="image/*" multiple hidden>
      <label><input type="checkbox" id="rs" checked> Kecilkan ke 2400 px (hemat kuota 1 GB)</label>
      <span class="m" id="ust"></span>
    </div>
    <div class="r"><b id="pc">0 dipilih klien</b><button id="cl">Salin daftar favorit</button><button class="d" id="dg">Hapus galeri</button></div>
    <div class="g" id="g"></div>
  </div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key);
const $=id=>document.getElementById(id);
const pub=p=>sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
let G=null,P=[];
async function boot(){const{data}=await sb.auth.getSession();data.session?app():showLogin()}
function showLogin(){$('login').hidden=false;$('app').hidden=true}
$('login').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(error)$('le').textContent='Email atau kata sandi salah.';else app()};
$('out').onclick=async()=>{await sb.auth.signOut();G=null;showLogin()};
async function app(){$('login').hidden=true;$('app').hidden=false;await list()}
async function list(){
  const{data}=await sb.from('galleries').select('*').order('created_at',{ascending:false});
  const l=$('gl');l.textContent='';
  (data||[]).forEach(g=>{const b=document.createElement('button');b.textContent=g.title;if(G&&G.id===g.id)b.className='on';b.onclick=()=>openG(g);l.appendChild(b)});
  if(!data||!data.length)l.textContent='Belum ada galeri. Buat yang pertama di atas.';
}
$('nf').onsubmit=async e=>{
  e.preventDefault();const t=$('nt').value.trim();if(!t)return;
  const{data,error}=await sb.from('galleries').insert({title:t}).select().single();
  if(error)return alert('Gagal membuat galeri: '+error.message);
  $('nt').value='';openG(data);
};
async function openG(g){
  G=g;$('det').hidden=false;$('gt').textContent=g.title;
  $('lk').value=new URL('index.html?g='+g.code,location.href).href;
  await list();await photos();
}
async function photos(){
  const[a,b]=await Promise.all([
    sb.from('photos').select('*').eq('gallery_id',G.id).order('created_at'),
    sb.from('picks').select('photo_id').eq('gallery_id',G.id)]);
  P=a.data||[];const k=new Set((b.data||[]).map(x=>x.photo_id));P.forEach(p=>p.picked=k.has(p.id));draw();
}
function draw(){
  const g=$('g');g.textContent='';
  P.forEach((p,i)=>{
    const f=document.createElement('div');f.className='f'+(p.picked?' on':'');
    const im=document.createElement('img');im.src=pub(p.path);im.loading='lazy';im.alt=p.name||'';
    const r=document.createElement('div');const n=document.createElement('span');n.textContent=String(i+1).padStart(2,'0')+' '+(p.name||'');
    const x=document.createElement('button');x.className='d';x.textContent='Hapus';x.onclick=()=>delPhoto(p);
    r.append(n,x);f.append(im,r);g.appendChild(f);
  });
  $('pc').textContent=P.filter(p=>p.picked).length+' dipilih klien (dari '+P.length+' foto)';
}
$('cp').onclick=()=>{$('lk').select();navigator.clipboard.writeText($('lk').value);$('cp').textContent='Tautan disalin'; setTimeout(()=>$('cp').textContent='Salin tautan klien',2000)};
$('cl').onclick=()=>{const t=P.filter(p=>p.picked).map(p=>p.name).join('\n');navigator.clipboard.writeText(t);alert(t?'Daftar favorit disalin:\n\n'+t:'Klien belum memilih foto.')};
$('up').onclick=()=>$('fi').click();
async function shrink(f,max){
  const bm=await createImageBitmap(f);const s=Math.min(1,max/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
  c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.88));
}
$('fi').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';let n=0,bad=0;
  for(const f of fs){
    $('ust').textContent='Mengunggah '+(++n)+' dari '+fs.length+'…';
    try{
      const small=$('rs').checked;
      const blob=small?await shrink(f,2400):f;
      const ext=small?'jpg':(f.name.split('.').pop().toLowerCase()||'jpg');
      const path=G.code+'/'+crypto.randomUUID()+'.'+ext;
      const u=await sb.storage.from('photos').upload(path,blob,{contentType:blob.type||'image/jpeg'});
      if(u.error)throw u.error;
      const name=f.name.replace(/\.[^.]+$/,'')+'.'+ext;
      const i=await sb.from('photos').insert({gallery_id:G.id,path,name});
      if(i.error)throw i.error;
    }catch(err){bad++;console.error(err)}
  }
  $('ust').textContent=bad?bad+' foto gagal diunggah.':'Selesai.';await photos();
};
async function delPhoto(p){
  if(!confirm('Hapus foto ini?'))return;
  await sb.storage.from('photos').remove([p.path]);await sb.from('photos').delete().eq('id',p.id);await photos();
}
$('dg').onclick=async()=>{
  if(!confirm('Hapus galeri "'+G.title+'" beserta semua fotonya? Ini tidak bisa dibatalkan.'))return;
  if(P.length)await sb.storage.from('photos').remove(P.map(p=>p.path));
  await sb.from('galleries').delete().eq('id',G.id);G=null;$('det').hidden=true;await list();
};
boot();
</script>
</body></html>
