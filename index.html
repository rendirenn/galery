<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeri</title>
<style>
:root{--bg:#eceef0;--ink:#16181b;--mut:#626a72;--card:#fff;--acc:#2a3cff;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#15171a;--ink:#eef0f2;--mut:#99a0a8;--card:#1f2226;--acc:#7b88ff;--on:#10131a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{max-width:1200px;margin:0 auto;padding:36px 20px 12px}
h1{margin:0;font-size:clamp(30px,6vw,52px);line-height:1.05;letter-spacing:-.025em}
header p{margin:8px 0 0;color:var(--mut);max-width:60ch}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--mut)}
.bar div{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;gap:12px;align-items:center}
.bar b{flex:1}
button{font:inherit;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:600}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
#s{color:var(--mut);padding:40px 0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.f{background:var(--card);padding:8px 8px 6px}
.f.on{outline:4px solid var(--acc)}
.f img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;cursor:zoom-in}
.f div{display:flex;align-items:center;gap:8px;padding-top:6px;font-size:14px;color:var(--mut)}
.f span{flex:1}
.f button{padding:4px 10px;font-size:14px}
</style>
</head>
<body>
<header><h1 id="t">Galeri</h1><p>Tandai foto favoritmu dengan tombol Pilih, lalu unduh. Pilihanmu otomatis terkirim ke fotografer.</p></header>
<div class="bar"><div><b id="c">0 dipilih</b><button class="p" id="da" disabled>Unduh favorit</button></div></div>
<main><div id="s">Memuat galeri…</div><div class="g" id="g"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key);
const code=new URLSearchParams(location.search).get('g');
const $=id=>document.getElementById(id);
const pub=p=>sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
let P=[];
async function load(){
  if(!code){$('s').textContent='Tautan galeri tidak valid. Minta tautan baru ke fotografer.';return}
  const{data,error}=await sb.rpc('get_gallery',{p_code:code});
  if(error||!data){$('s').textContent='Galeri tidak ditemukan atau tautannya salah.';return}
  $('t').textContent=data.title;document.title=data.title;P=data.photos;draw();
}
function draw(){
  const g=$('g');g.textContent='';
  $('s').style.display=P.length?'none':'block';
  if(!P.length)$('s').textContent='Belum ada foto di galeri ini.';
  P.forEach((p,i)=>{
    const f=document.createElement('div');f.className='f'+(p.picked?' on':'');
    const im=document.createElement('img');im.src=pub(p.path);im.loading='lazy';im.alt=p.name||'Foto '+(i+1);
    im.onclick=()=>window.open(im.src,'_blank');
    const r=document.createElement('div');
    const n=document.createElement('span');n.textContent=String(i+1).padStart(2,'0');
    const a=document.createElement('button');a.textContent=p.picked?'Dipilih':'Pilih';if(p.picked)a.className='p';a.onclick=()=>pick(p);
    const d=document.createElement('button');d.textContent='Unduh';d.onclick=()=>dl(p);
    r.append(n,a,d);f.append(im,r);g.appendChild(f);
  });
  const k=P.filter(p=>p.picked).length;$('c').textContent=k+' dipilih';$('da').disabled=!k;
}
async function pick(p){
  const v=!p.picked;p.picked=v;draw();
  const{error}=await sb.rpc('set_pick',{p_code:code,p_photo:p.id,p_picked:v});
  if(error){p.picked=!v;draw();alert('Pilihan gagal disimpan. Coba lagi.')}
}
async function dl(p){
  try{
    const b=await(await fetch(pub(p.path))).blob();
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=p.name||'foto.jpg';a.click();
  }catch(e){window.open(pub(p.path),'_blank')}
}
$('da').onclick=async()=>{for(const p of P.filter(x=>x.picked)){await dl(p);await new Promise(r=>setTimeout(r,500))}};
load();
</script>
</body>
</html>
